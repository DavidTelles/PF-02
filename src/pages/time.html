<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teams | Septem Racing</title>
  <link rel="stylesheet" href="../styles/style.css">
</head>
<body>
<div class="page-wrapper">

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <span class="brand-name">Septem</span>
      <span class="brand-sub">Racing Management</span>
    </div>
    <nav class="sidebar-nav">
      <p class="nav-label">Main</p>
      <a href="dashboard.html" class="nav-item"><span class="nav-icon">⬡</span> Dashboard</a>
      <a href="corredores.html" class="nav-item"><span class="nav-icon">◎</span> Runners</a>
      <a href="time.html" class="nav-item active"><span class="nav-icon">◇</span> Teams</a>
      <div class="nav-divider"></div>
      <p class="nav-label">System</p>
      <a href="faq.html" class="nav-item"><span class="nav-icon">?</span> FAQ</a>
    </nav>
        <div class="sidebar-bottom">
        <a href="../../index.html" class="nav-item"><span class="nav-icon">⬡</span> Home</a>
        <button onclick="logout()" class="nav-item nav-logout" style="width:100%;background:none;border:none;cursor:pointer;text-align:left;color:var(--red,#ef4444)">
        <span class="nav-icon">⏻</span> Sair
        </button>
    </div>
  </aside>
  <button class="sidebar-toggle" id="sidebarToggle">☰</button>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <main class="main-content">
    <div class="topbar">
      <div class="topbar-left">
        <h1>Teams</h1>
        <p class="page-subtitle">Equipes e pilotos cadastrados</p>
      </div>
      <div class="topbar-right">
        <span class="badge badge-gold">7 Equipes</span>
      </div>
    </div>

    <!-- Stats -->
    <div class="stats-grid" style="grid-template-columns:repeat(4,1fr)">
      <div class="stat-card">
        <div class="stat-label">Equipes</div>
        <div class="stat-value gold">7</div>
      </div>
    </div>

    <!-- Teams + Drivers -->
    <!-- Botão Nova Equipe -->

<button class="btn btn-primary btn-sm" onclick="abrirModalEquipe()">
  + Nova Equipe
</button>

<div class="panel mt-3">
  <div class="panel-header">
    <span class="panel-title">Gerenciamento de Equipes</span>
  </div>

  <div class="table-wrapper">
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Nome</th>
          <th>País</th>
          <th>Ações</th>
        </tr>
      </thead>
  <tbody id="teamsTable">
    <tr>
      <td colspan="4">Carregando equipes...</td>
    </tr>
  </tbody>
</table>

  </div>
</div>

<!-- Modal -->

<div id="modalEquipe" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);align-items:center;justify-content:center;z-index:9999;">
  <div style="background:#111827;padding:25px;border-radius:16px;width:400px;max-width:95%;">

<h2 id="modalTitle">Nova Equipe</h2>

<input
  type="text"
  id="teamName"
  placeholder="Nome da equipe"
  style="width:100%;padding:10px;margin-top:15px;"
>

<input
  type="text"
  id="teamCountry"
  placeholder="País"
  style="width:100%;padding:10px;margin-top:10px;"
>

<div style="display:flex;gap:10px;margin-top:20px;">
  <button
    class="btn btn-primary"
    onclick="salvarEquipe()"
  >
    Salvar
  </button>

  <button
    class="btn btn-ghost"
    onclick="fecharModalEquipe()"
  >
    Cancelar
  </button>
</div>
  </main>
</div>

<script>
  document.getElementById('sidebarToggle').addEventListener('click', () => {
    document.getElementById('sidebar').classList.toggle('mobile-open');
    document.getElementById('sidebarOverlay').classList.toggle('active');
  });
  document.getElementById('sidebarOverlay').addEventListener('click', () => {
    document.getElementById('sidebar').classList.remove('mobile-open');
    document.getElementById('sidebarOverlay').classList.remove('active');
  });
</script>
<!-- Middleware de autenticação frontend -->
<script src="../scripts/auth.js"></script>
<script>
  checkAuth();

  let editandoId = null;

async function carregarEquipes() {

  try {

    const response =
      await fetch('http://localhost:3000/teams');

    const teams =
      await response.json();

    document.querySelector('.badge-gold').textContent =
      `${teams.length} Equipes`;

    document.querySelector('.gold').textContent =
      teams.length;

    const table =
      document.getElementById('teamsTable');

    table.innerHTML = '';

    teams.forEach(team => {

      table.innerHTML += `
        <tr>
          <td>${team.id}</td>
          <td>${team.name}</td>
          <td>${team.country}</td>

          <td>
            <button
              class="btn btn-primary btn-sm"
              onclick="editarEquipe(
                ${team.id},
                '${team.name}',
                '${team.country}'
              )"
            style="margin:2px">
              Editar
            </button>

            <button
            class="btn btn-primary btn-sm"
              onclick="excluirEquipe(${team.id})"
            style="margin:2px">
              Excluir
            </button>
          </td>
        </tr>
      `;

    });

  } catch(err) {

    console.error(err);

  }
}

function abrirModalEquipe() {

  editandoId = null;

  document.getElementById('modalTitle').innerText =
    'Nova Equipe';

  document.getElementById('teamName').value = '';

  document.getElementById('teamCountry').value = '';

  document.getElementById('modalEquipe').style.display =
    'flex';
}

function fecharModalEquipe() {

  document.getElementById('modalEquipe').style.display =
    'none';
}

function editarEquipe(id, nome, pais) {

  editandoId = id;

  document.getElementById('modalTitle').innerText =
    'Editar Equipe';

  document.getElementById('teamName').value =
    nome;

  document.getElementById('teamCountry').value =
    pais;

  document.getElementById('modalEquipe').style.display =
    'flex';
}

async function salvarEquipe() {

  const token =
    localStorage.getItem('token');

  const name =
    document.getElementById('teamName').value;

  const country =
    document.getElementById('teamCountry').value;

  try {

    let url =
      'http://localhost:3000/teams/create';

    let method = 'POST';

    if (editandoId) {

      url =
        `http://localhost:3000/teams/edit?id=${editandoId}`;

      method = 'PUT';
    }

    const response =
      await fetch(url, {
        method,

        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${token}`
        },

        body: JSON.stringify({
          name,
          country
        })
      });

    const result =
      await response.json();

    alert(
      result.message ||
      'Equipe salva com sucesso'
    );

    fecharModalEquipe();

    carregarEquipes();

  } catch(err) {

    console.error(err);

    alert('Erro ao salvar equipe');

  }
}

async function excluirEquipe(id) {

  if (
    !confirm(
      'Deseja realmente excluir esta equipe?'
    )
  ) {
    return;
  }

  const token =
    localStorage.getItem('token');

  try {

    const response =
      await fetch(
        `http://localhost:3000/teams/delete?id=${id}`,
        {
          method: 'DELETE',

          headers: {
            'Authorization': `Bearer ${token}`
          }
        }
      );

    const result =
      await response.json();

    alert(
      result.message ||
      'Equipe excluída'
    );

    carregarEquipes();

  } catch(err) {

    console.error(err);

    alert('Erro ao excluir');

  }
}

carregarEquipes();
</script>

</body>
</html>

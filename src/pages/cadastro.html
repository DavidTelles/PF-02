<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro | Septem Racing</title>
  <link rel="stylesheet" href="../styles/style.css">
</head>

<body>
  <div class="center-page" style="background:var(--black);position:relative;overflow:hidden">
    <div
      style="position:absolute;inset:0;background:radial-gradient(ellipse 50% 60% at 50% 50%, rgba(212,175,55,0.05) 0%, transparent 70%);pointer-events:none">
    </div>
    <div
      style="position:absolute;inset:0;background-image:linear-gradient(rgba(212,175,55,0.03) 1px, transparent 1px),linear-gradient(90deg,rgba(212,175,55,0.03) 1px,transparent 1px);background-size:50px 50px;pointer-events:none;mask-image:radial-gradient(ellipse 70% 70% at 50% 50%, black 30%, transparent 70%)">
    </div>

    <div style="position:relative;z-index:2;width:100%;display:flex;flex-direction:column;align-items:center">
      <a href="../../index.html"
        style="font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--text-muted);margin-bottom:32px;display:inline-flex;align-items:center;gap:6px;transition:color .25s"
        onmouseover="this.style.color='var(--gold)'" onmouseout="this.style.color='var(--text-muted)'">
        ← Voltar ao início
      </a>

      <div class="form-card">
        <div class="form-card-header">
          <div
            style="font-family:var(--font-display);font-size:13px;letter-spacing:3px;color:var(--gold);text-transform:uppercase;margin-bottom:12px">
            Septem Racing</div>
          <h2>Criar Conta</h2>
          <p>Entre no grid da <span>Septem Racing</span></p>
        </div>

        <form id="cadastroForm">
          <div class="input-group">
            <label>Nome de Usuário</label>
            <input type="text" id="name" placeholder="Seu nome" required>
          </div>
          <div class="input-group">
            <label>Email</label>
            <input type="email" id="email" placeholder="seu@email.com" required>
          </div>
          <div class="input-group">
            <label>Senha</label>
            <input type="password" id="password" placeholder="••••••••" required minlength="6">
          </div>
          <div class="input-group">
            <label>Confirmar Senha</label>
            <input type="password" id="confirmPassword" placeholder="••••••••" required>
          </div>
          <button type="submit" class="btn btn-primary btn-full" style="margin-top:8px">
            Cadastrar
          </button>
        </form>

        <div style="margin-top:20px;display:flex;align-items:center;gap:12px">
          <div style="flex:1;height:1px;background:var(--border)"></div>
          <span style="font-size:11px;color:var(--text-muted)">ou</span>
          <div style="flex:1;height:1px;background:var(--border)"></div>
        </div>

        <p style="margin-top:16px;font-size:13px;text-align:center;color:var(--text-secondary)">
          Já tem conta?
          <a href="login.html" style="color:var(--gold);font-weight:600;transition:opacity .2s"
            onmouseover="this.style.opacity='.7'" onmouseout="this.style.opacity='1'">
            Entrar
          </a>
        </p>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script>
    function showToast(msg, type = 'success') {
      const c = document.getElementById('toastContainer');
      const t = document.createElement('div');
      t.className = `toast ${type}`;
      t.innerHTML = `<span>${type === 'success' ? '✓' : '✕'}</span> ${msg}`;
      c.appendChild(t);
      setTimeout(() => t.remove(), 3800);
    }

    document.getElementById('cadastroForm').addEventListener('submit', async e => {
      e.preventDefault();
      const btn = e.target.querySelector('button[type=submit]');
      const pwd = document.getElementById('password').value;
      const cpwd = document.getElementById('confirmPassword').value;

      if (pwd !== cpwd) { showToast('As senhas não coincidem', 'error'); return; }

      btn.textContent = 'Cadastrando...';
      btn.disabled = true;

      const data = {
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        password: document.getElementById('password').value,
      };

      try {
        const res = await fetch('http://localhost:3002/users/create', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(data)
        });

        const result = await res.json();

        if (res.ok) {
          showToast('Conta criada com sucesso!', 'success');

          e.target.reset();

          setTimeout(() => {
            window.location.href = 'login.html';
          }, 1800);

        } else {
          showToast(result.error || result.message || 'Erro ao criar conta', 'error');
        }

      } catch (err) {
        console.error(err);
        showToast('Erro ao conectar com o servidor', 'error');
      } finally {
        btn.textContent = 'Cadastrar';
        btn.disabled = false;
      }
    });
  </script>
</body>

</html>
